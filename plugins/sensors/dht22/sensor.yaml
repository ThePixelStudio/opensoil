id: dht22
name: DHT22 Temperature & Humidity
version: 1.0.0
author: opensoil-core
topics:
  - key: dht22_temp
    unit: celsius
    mqtt: sensors/dht22_temp
  - key: dht22_humidity
    unit: percent
    mqtt: sensors/dht22_humidity
poll_interval_sec: 30
hardware:
  protocol: gpio
  esphome_platform: dht
